{
  "services": [
    {
      "type": "web",
      "name": "vibe-agents-api",
      "env": "python",
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT",
      "healthCheckPath": "/api/health",
      "envVars": [
        {
          "key": "ANTHROPIC_API_KEY",
          "sync": false
        },
        {
          "key": "MU_API_KEY",
          "sync": false
        },
        {
          "key": "ALLOWED_ORIGINS",
          "sync": false
        },
        {
          "key": "LOG_LEVEL",
          "value": "INFO"
        }
      ]
    }
  ]
}
